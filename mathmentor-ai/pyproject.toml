[project]
name = "mathmentor-ai"
version = "0.1.0"
description = "Production-grade personalized AI tutor for Vietnamese high school mathematics."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "bcrypt>=4.1.3",
  # celery 5.4.0          -- disabled (no Redis)
  "fastapi>=0.115.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.2",
  "openai>=1.93.0",
  "prometheus-client>=0.20.0",
  "pgvector>=0.3.6",
  "pydantic[email]>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-frontmatter>=1.1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  # redis 5.0.8           -- disabled
  "sentence-transformers>=3.1.1",
  "sqlalchemy[asyncio]>=2.0.32",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "docker*", "tests*", "wiki_content*"]

[project.scripts]
start = "app.main:start"

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "pip-audit>=2.7.3",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008", "S101", "S104", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
