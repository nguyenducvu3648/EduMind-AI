services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mathmentor:mathmentor@db:5432/mathmentor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8000
    depends_on:
      - db
      - redis
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mathmentor:mathmentor@db:5432/mathmentor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app worker -Q memory_updates,ingestion,evaluation,maintenance -c 2 --loglevel=INFO

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mathmentor:mathmentor@db:5432/mathmentor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=INFO

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mathmentor
      POSTGRES_USER: mathmentor
      POSTGRES_PASSWORD: mathmentor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
